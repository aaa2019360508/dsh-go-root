# Temporary experiment for perf native batch 10 (not for main):
# request 921: Linux x86-64 ORT 1.27 full CPU build pair (baseline vs --include_ops_by_config)
# and the six-model numeric comparison from the request's own bundle. Text evidence only.
name: ci-exp native10

on:
  push:
    branches: ['ci-exp/native10']

permissions:
  contents: read

jobs:
  r921:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Prepare tools and inputs
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          private_root="$RUNNER_TEMP/private"
          cp -r .github/ci-exp/r921 "$bundle"
          mkdir -p "$private_root"
          echo "bundle=$bundle" >> "$GITHUB_ENV"
          echo "private_root=$private_root" >> "$GITHUB_ENV"
          python3.12 -m venv "$private_root/venv"
          source "$private_root/venv/bin/activate"
          python -m pip install -q --only-binary=:all: 'numpy==2.3.5' 'flatbuffers==25.2.10' 'cmake==3.31.6' 'ninja==1.11.1.4'
          echo "$private_root/venv/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          python -c 'import sys,numpy,flatbuffers; print(sys.version,numpy.__version__,flatbuffers.__version__)'
          (cd "$bundle" && python "$bundle/verify.py")
          python - "$bundle/build-plan/environment-dependencies.json" "$private_root" <<'PY'
          import hashlib, json, pathlib, shutil, sys, urllib.request
          src, root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          for row in json.loads(src.read_text())["jars"]:
              folder = root / row["location"]
              folder.mkdir(parents=True, exist_ok=True)
              path = folder / row["filename"]
              if not path.exists():
                  tmp = path.with_suffix(".part")
                  with urllib.request.urlopen(row["url"], timeout=120) as response, tmp.open("wb") as f:
                      shutil.copyfileobj(response, f)
                  with tmp.open("rb") as f:
                      assert tmp.stat().st_size == row["bytes"] and hashlib.file_digest(f, "sha256").hexdigest() == row["sha256"]
                  tmp.replace(path)
              with path.open("rb") as f:
                  assert path.stat().st_size == row["bytes"] and hashlib.file_digest(f, "sha256").hexdigest() == row["sha256"]
          PY
          python "$bundle/fetch_inputs.py" --inputs "$private_root/inputs" --fetch-missing
      - name: ORT source
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ort"
          echo "ort_source=$src" >> "$GITHUB_ENV"
          rev=8f0278c77bf44b0cc83c098c6c722b92a36ac4b5
          tree=5ea4a49d0be5e5a620cabaa01f85d924b2fa5995
          mkdir "$src"
          git -C "$src" init -q
          git -C "$src" remote add origin https://github.com/microsoft/onnxruntime.git
          if ! git -C "$src" fetch --no-tags --depth=1 origin "$rev"; then
            git -C "$src" remote set-url origin https://github.com/intel/onnxruntime.git
            git -C "$src" fetch --no-tags --depth=1 origin "$rev"
          fi
          test "$(git -C "$src" rev-parse 'FETCH_HEAD^{commit}')" = "$rev"
          test "$(git -C "$src" rev-parse 'FETCH_HEAD^{tree}')" = "$tree"
          git -C "$src" checkout -q --detach "$rev"
          git -C "$src" submodule update --init --recursive --depth=1
          git -C "$src" remote -v
      - name: Build pair
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/new-ort-pair"
          echo "build_work=$work" >> "$GITHUB_ENV"
          cfg="$bundle/build-plan/required-operators.config"
          bash "$bundle/build-plan/build-pair.sh" plan "$ort_source" "$work" "$cfg" | tee "$RUNNER_TEMP/plan.txt"
          bash "$bundle/build-plan/build-pair.sh" build "$ort_source" "$work" "$cfg"
          df -h /
      - name: Run pair
        run: |
          set -euo pipefail
          run_work="$RUNNER_TEMP/new-model-pair"
          echo "run_work=$run_work" >> "$GITHUB_ENV"
          args=(--inputs "$private_root/inputs" --kotlin-jars "$private_root/kotlin-jars"
                --json-jar "$private_root/json-jar/json-20240303.jar"
                --baseline-library "$build_work/build-baseline/Release/libonnxruntime.so"
                --candidate-library "$build_work/build-candidate/Release/libonnxruntime.so"
                --build-evidence "$build_work/evidence" --work "$run_work")
          python3.12 "$bundle/run-pair.py" "${args[@]}" --plan | tee "$RUNNER_TEMP/run-plan.txt"
          python3.12 "$bundle/run-pair.py" "${args[@]}"
      - name: Collect text evidence
        if: always()
        run: |
          set -x
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp "$RUNNER_TEMP"/plan.txt "$RUNNER_TEMP"/run-plan.txt "$out/" || true
          git rev-parse HEAD > "$out/workflow-commit.txt"
          { uname -a; lsb_release -a; nproc; free -b; df -h /; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"; } > "$out/runner.txt" 2>&1 || true
          [ -d "${build_work:-/nonexistent}/evidence" ] && cp -r "$build_work/evidence" "$out/build-evidence"
          [ -d "${run_work:-/nonexistent}/evidence" ] && cp -r "$run_work/evidence" "$out/run-evidence"
          cp .github/workflows/ci-exp-native10.yml "$out/"
          find "$out" -type f -printf '%s %p\n' | sort -k2 > "$RUNNER_TEMP/listing.txt"; mv "$RUNNER_TEMP/listing.txt" "$out/LISTING.txt"
          du -sh "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r921-evidence
          path: ${{ runner.temp }}/out
          retention-days: 7
