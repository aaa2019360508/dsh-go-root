name: root-apk

# Builds the arm64 APK with root mode and uploads it to the root-mode release.
#
# The runtime (Ubuntu + Node + patched DSH) is built from source here rather than committed:
# runtime/out is ~240 MB and upstream's own CI treats it the same way. A cold run takes
# 25–45 min; the caches below make later runs shorter.
#
# The APK is signed with the debug key (app/build.gradle.kts falls back to it when no
# release keystore is configured), so it installs next to nothing else: uninstall the
# official build first if it is already on the phone.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'tooling/**'
      - '.github/workflows/root-release.yml'

permissions:
  contents: write

concurrency:
  group: root-apk
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  RELEASE_TAG: v1.3.0-root.1

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk (keep the NDK and build-tools)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android SDK packages (platform 36, build-tools 36, NDK 28.2)
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          # The runner image exports ANDROID_NDK_HOME for its own default NDK; tawcroot and
          # Gradle both pin 28.2.13676358, so point the environment at that one explicitly.
          echo "ANDROID_NDK_HOME=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          flutter config --no-analytics --android-sdk "$sdk"
          ls "$sdk/ndk"

      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-cache-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-cache-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle.kts', 'app/pubspec.yaml') }}
          restore-keys: gradle-

      - name: Build runtime (Ubuntu + Node + patched DSH)
        run: |
          set -euo pipefail
          bash runtime/build-runtime.sh arm64-v8a
          du -sh runtime/out/arm64-v8a
          python3 -I tooling/check_runtime_bundle.py arm64

      - name: Build APK
        id: apk
        run: |
          set -euo pipefail
          name="${RELEASE_TAG#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --no-companion --no-star \
            --build-name "$name" --keep-daemon
          ls -la app/build/app/outputs/flutter-apk/

      - name: Checksums and rename
        run: |
          set -euo pipefail
          cd app/build/app/outputs/flutter-apk
          cp app-arm64-release.apk "dsh-go-root-${{ steps.apk.outputs.name }}-arm64.apk"
          sha256sum "dsh-go-root-${{ steps.apk.outputs.name }}-arm64.apk" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the root-mode release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir=app/build/app/outputs/flutter-apk
          apk="$dir/dsh-go-root-${{ steps.apk.outputs.name }}-arm64.apk"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" "$dir/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk" "$dir/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DSH Go ${{ steps.apk.outputs.name }} · Root 模式" \
              --notes-file docs/root-mode-release.md
          fi

      - name: Keep the APK even when the release step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-apk
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-release.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: warn
